name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # compileSdk is 37.1 — see gradle/libs.versions.toml for why it differs
      # from targetSdk. The runner image does not ship that platform, and it
      # keeps sdkmanager off PATH, so resolve the binary explicitly.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f -perm -u+x 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          # `yes` exits on SIGPIPE once sdkmanager stops reading; that is expected.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"

      # INVARIANT: :core is the pure-logic module and must stay headless so it
      # runs from the CLI with no emulator. An Android import here is a
      # review-blocking defect, so fail the build rather than the code review.
      - name: Assert :core has no Android dependencies
        run: |
          if grep -rnE '^import (android|androidx)\.' core/src/; then
            echo "::error::core/ must not import Android APIs — it is the pure-logic module."
            exit 1
          fi
          echo "OK: core/ is free of Android imports."

      # The correctness gate for the whole port. Runs headless.
      - name: Core logic tests
        run: ./gradlew :core:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      # Release compiles with warnings-as-errors and runs lintVital + R8.
      - name: Release build
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          retention-days: 7
