[versions]
# Toolchain
agp = "9.3.1"
kotlin = "2.4.10"
jvmTarget = "17"
# No KSP entry. Nothing applies it until M4 brings in Room, and KSP's versioning
# changed schemes mid-flight — releases up to 2.2.21-2.0.5 pinned a Kotlin
# version in the coordinate, while 2.3.x onward decoupled. That leaves no release
# that names Kotlin 2.4.10, so any version pinned today is an unverifiable guess.
# M4 picks one and validates it against the Kotlin in use then.

# Android SDK levels.
#
# compileSdk and targetSdk are deliberately different, and that is not a mistake:
#   compileSdk 37.1 — forced by AndroidX; core-ktx 1.19.0, activity-compose 1.13.0,
#                     lifecycle 2.11.0 and the Compose BOM all refuse to be consumed
#                     by a project compiling against 36. It only controls which APIs
#                     are visible at compile time.
#   targetSdk  36   — the level whose *runtime behaviour changes* we opt into, and
#                     the floor Play requires for new apps submitted after
#                     2026-08-31. Staying at 36 means we are not silently adopting
#                     Android 17 behaviour changes we have not tested against.
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "26"
targetSdk = "36"

# AndroidX / Compose
composeBom = "2026.06.01"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
room = "2.8.4"
work = "2.11.2"
billing = "9.1.0"

# Kotlin runtime
coroutines = "1.11.0"

# Test
junitBom = "6.1.2"
turbine = "1.2.1"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
# --- :core (pure Kotlin, JVM only) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# --- :app ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# M4 persistence
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# M5 background work (cold-brew notification)
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# M8 Play Billing
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

# --- Test ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# :app must ask for the JUnit 5 variant explicitly. In :core the kotlin-jvm
# plugin sees useJUnitPlatform() and resolves kotlin-test to kotlin-test-junit5
# automatically; under AGP 9's built-in Kotlin that does not happen, and plain
# kotlin-test has no `kotlin.test.Test`, so tests fail to compile.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android entry: AGP 9 applies Kotlin to Android modules itself and
# rejects the standalone plugin. https://kotl.in/gradle/agp-built-in-kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
